# git-cliff configuration (https://git-cliff.org/docs/configuration).
# Used by .github/workflows/release.yml to write CHANGELOG.md, GitHub release
# notes and to compute the next version (`git cliff --bumped-version`).
#
# Commits may follow Conventional Commits (feat:, fix:, ...) but do not have to;
# plain "Imperative sentence" commits land under "Changes". feat → minor bump,
# fix/other → patch, "!"/BREAKING CHANGE → minor while we are on 0.x.

[changelog]
header = """
# Changelog

All notable changes to Samsyn. Generated by [git-cliff](https://git-cliff.org) from
the commit history; pre-releases (`X.Y.Z-beta.N`) are folded into the stable
release that follows them.

"""
body = """
{%- if version %}
## [{{ version }}](https://github.com/mrboatsman/samsyn/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/mrboatsman/samsyn/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Only stable tags are releases; beta tags fold into the next stable section.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(chore|ci|build|test|refactor|style)", group = "<!-- 5 -->Internal" },
  { message = ".*", group = "<!-- 3 -->Changes" },
]

[bump]
initial_tag = "0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
