[package]
name = "replica-server"
version = "0.1.0"
edition = "2021"
description = "CRDT sync server for the Replica Obsidian plugin"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
data-encoding = "2"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
notify-debouncer-mini = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "charset", "blocking", "json"] }
tar = "0.4"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
walkdir = "2"
gethostname = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yrs = { version = "0.28", features = ["sync"] }
iroh = "1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
