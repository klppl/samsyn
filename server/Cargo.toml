[package]
name = "replica-server"
version = "0.1.0"
edition = "2021"
description = "CRDT sync server for the Replica Obsidian plugin"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yrs = { version = "0.28", features = ["sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
